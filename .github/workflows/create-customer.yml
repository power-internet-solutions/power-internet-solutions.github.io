name: Δημιουργία ιστοσελίδας πελάτη
on:
  workflow_dispatch:
    inputs:
      slug: {description: "Μοναδικό URL, π.χ. bakery-karditsa", required: true, type: string}
      company: {description: "Όνομα καταστήματος", required: true, type: string}
      owner: {description: "Ονοματεπώνυμο ιδιοκτήτη", required: true, type: string}
      firstname: {description: "Όνομα ιδιοκτήτη", required: true, type: string}
      lastname: {description: "Επώνυμο ιδιοκτήτη", required: true, type: string}
      owner_title: {description: "Ιδιότητα", required: false, type: string}
      phone: {description: "Τηλέφωνο με κωδικό χώρας", required: false, type: string}
      email: {description: "Email", required: false, type: string}
      website: {description: "Ιστοσελίδα με https://", required: false, type: string}
      address: {description: "Διεύθυνση", required: false, type: string}
      hours: {description: "Ωράριο", required: false, type: string}
      description: {description: "Περιγραφή επιχείρησης", required: true, type: string}
      tagline: {description: "Σύντομο μήνυμα στην κορυφή", required: false, type: string}
      owner_bio: {description: "Κείμενο για τον ιδιοκτήτη", required: false, type: string}
      background: {description: "Διαδρομή εικόνας φόντου", required: false, type: string}
      photo: {description: "Διαδρομή φωτογραφίας ιδιοκτήτη", required: false, type: string}
      gallery1: {description: "Διαδρομή πρώτης φωτογραφίας gallery", required: false, type: string}
      gallery2: {description: "Διαδρομή δεύτερης φωτογραφίας gallery", required: false, type: string}
      instagram: {description: "URL Instagram", required: false, type: string}
      facebook: {description: "URL Facebook", required: false, type: string}
      tiktok: {description: "URL TikTok", required: false, type: string}
      linkedin: {description: "URL LinkedIn", required: false, type: string}

permissions:
  contents: write

jobs:
  create-customer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Δημιουργία αρχείου πελάτη
        env:
          SLUG: ${{ inputs.slug }}
          COMPANY: ${{ inputs.company }}
          OWNER: ${{ inputs.owner }}
          FIRSTNAME: ${{ inputs.firstname }}
          LASTNAME: ${{ inputs.lastname }}
          OWNER_TITLE: ${{ inputs.owner_title }}
          PHONE: ${{ inputs.phone }}
          EMAIL: ${{ inputs.email }}
          WEBSITE: ${{ inputs.website }}
          ADDRESS: ${{ inputs.address }}
          HOURS: ${{ inputs.hours }}
          DESCRIPTION: ${{ inputs.description }}
          TAGLINE: ${{ inputs.tagline }}
          OWNER_BIO: ${{ inputs.owner_bio }}
          BACKGROUND: ${{ inputs.background }}
          PHOTO: ${{ inputs.photo }}
          GALLERY1: ${{ inputs.gallery1 }}
          GALLERY2: ${{ inputs.gallery2 }}
          INSTAGRAM: ${{ inputs.instagram }}
          FACEBOOK: ${{ inputs.facebook }}
          TIKTOK: ${{ inputs.tiktok }}
          LINKEDIN: ${{ inputs.linkedin }}
        run: |
          python3 <<'PY'
          import json, os, re
          from pathlib import Path
          slug = os.environ["SLUG"].strip().lower()
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug):
              raise SystemExit("Το URL πρέπει να περιέχει μόνο λατινικά μικρά γράμματα, αριθμούς και παύλες.")
          target = Path("_customers") / (slug + ".md")
          if target.exists():
              raise SystemExit("Υπάρχει ήδη πελάτης με αυτό το URL. Διάλεξε άλλο slug.")
          def v(k): return os.environ.get(k, "").strip()
          def q(s): return json.dumps(s, ensure_ascii=False)
          fields = [
            ("firstname","FIRSTNAME"),("lastname","LASTNAME"),("name","OWNER"),("owner","OWNER"),
            ("owner_title","OWNER_TITLE"),("company","COMPANY"),("tagline","TAGLINE"),
            ("description","DESCRIPTION"),("owner_bio","OWNER_BIO"),("phone","PHONE"),
            ("email","EMAIL"),("website","WEBSITE"),("address","ADDRESS"),("hours","HOURS"),
            ("photo","PHOTO"),("background","BACKGROUND"),("instagram","INSTAGRAM"),
            ("facebook","FACEBOOK"),("tiktok","TIKTOK"),("linkedin","LINKEDIN")]
          lines = ["---", "layout: customer"]
          for key, envkey in fields:
            if v(envkey): lines.append(f"{key}: {q(v(envkey))}")
          gallery = [v("GALLERY1"), v("GALLERY2")]
          gallery = [x for x in gallery if x]
          if gallery:
            lines.append("gallery:")
            for i, src in enumerate(gallery, 1):
              lines += [f"  - src: {q(src)}", f"    alt: {q(v('COMPANY') + ' - φωτογραφία ' + str(i))}"]
          lines += [f"permalink: /{slug}/", "---", ""]
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text("\n".join(lines), encoding="utf-8")
          print(f"Δημιουργήθηκε το {target}")
          PY
      - name: Commit και δημοσίευση
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _customers/
          git diff --cached --quiet && { echo "Δεν δημιουργήθηκαν αλλαγές."; exit 1; }
          git commit -m "Add customer page: ${{ inputs.slug }}"
          git push
