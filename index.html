layout: null
---
<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06152d">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <meta name="description" content="POWER INTERNET SOLUTIONS — Δυναμικές λύσεις για την παρουσία σας στον Παγκόσμιο Ιστό.">
  <title>POWER INTERNET SOLUTIONS</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: Arial, Helvetica, sans-serif; background: #06152d; color: #fff; }
    .hero {
      position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center;
      overflow: hidden; padding: clamp(28px, 6vw, 100px);
      background-image: linear-gradient(90deg, rgba(3,12,30,.34) 0%, rgba(3,12,30,.16) 44%, rgba(3,12,30,0) 72%), url('/assets/images/power-internet-hero.png');
      background-size: cover; background-position: center; background-repeat: no-repeat;
    }
    .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(0deg, rgba(2,9,22,.38), transparent 38%); }
    .content { position: relative; z-index: 1; max-width: 760px; padding: clamp(22px, 4vw, 48px); border-left: 3px solid #41c7ff; background: linear-gradient(90deg, rgba(3,13,31,.56), rgba(3,13,31,.20) 78%, transparent); text-shadow: 0 2px 18px rgba(0,0,0,.38); }
    .eyebrow { margin: 0 0 18px; color: #75d7ff; font-size: clamp(12px, 1.2vw, 15px); font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 720px; font-size: clamp(34px, 5.3vw, 76px); line-height: 1.05; letter-spacing: -.035em; font-weight: 800; }
    .subtitle { margin: 24px 0 0; max-width: 620px; font-size: clamp(19px, 2.2vw, 30px); line-height: 1.45; font-weight: 400; color: #f2f8ff; }
    .rule { width: 78px; height: 3px; background: #41c7ff; margin-top: 28px; border-radius: 3px; }
    @media (max-width: 760px) {
      .hero { min-height: 100svh; align-items: flex-end; padding: 22px 16px 9vh; background-position: 61% center; }
      .hero::after { background: linear-gradient(0deg, rgba(2,9,22,.84) 0%, rgba(2,9,22,.52) 43%, rgba(2,9,22,.05) 100%); }
      .content { padding: 22px 18px; border-left-width: 2px; background: linear-gradient(90deg, rgba(3,13,31,.44), rgba(3,13,31,.12)); }
      .eyebrow { letter-spacing: .14em; margin-bottom: 12px; }
      .subtitle { margin-top: 16px; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <section class="content" aria-label="POWER INTERNET SOLUTIONS">
      <p class="eyebrow">Digital presence · Smart solutions</p>
      <h1>POWER INTERNET SOLUTIONS</h1>
      <p class="subtitle">Δυναμικές λύσεις για την παρουσία σας στον Παγκόσμιο Ιστό.</p>
      <div class="rule" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
