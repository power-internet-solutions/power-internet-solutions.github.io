<!DOCTYPE html>
<html lang="el">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Ευχαριστούμε για το ενδιαφέρον σας για συνεργασία με την Power Internet Solutions.">

  <title>Ευχαριστούμε | Power Internet Solutions</title>

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }


    body {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 25px;

      background:
        radial-gradient(
          circle at top,
          #26364d 0%,
          #101722 45%,
          #080c12 100%
        );

      color: white;

    }


    .card {

      width: 100%;

      max-width: 650px;

      padding: 55px 40px;

      text-align: center;

      border-radius: 24px;

      background:
        rgba(255, 255, 255, 0.09);

      border:
        1px solid rgba(255, 255, 255, 0.18);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45);

      backdrop-filter:
        blur(15px);

      -webkit-backdrop-filter:
        blur(15px);

    }


    .check {

      width: 75px;

      height: 75px;

      margin: 0 auto 28px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.12);

      border:
        2px solid rgba(255, 255, 255, 0.35);

      font-size: 38px;

    }


    h1 {

      margin: 0 0 22px;

      font-size: 34px;

      font-weight: 600;

      letter-spacing: 0.2px;

    }


    .message {

      margin: 0 auto;

      max-width: 520px;

      font-size: 19px;

      line-height: 1.7;

      color:
        rgba(255, 255, 255, 0.88);

    }


    .message strong {

      display: block;

      margin-top: 22px;

      font-size: 20px;

      color: white;

    }


    .home-button {

      display: inline-block;

      margin-top: 38px;

      padding: 14px 30px;

      border-radius: 12px;

      background:
        rgba(255, 255, 255, 0.13);

      border:
        1px solid rgba(255, 255, 255, 0.25);

      color: white;

      text-decoration: none;

      font-size: 16px;

      transition:
        0.25s ease;

    }


    .home-button:hover {

      background:
        rgba(255, 255, 255, 0.22);

      transform:
        translateY(-2px);

    }


    .footer {

      margin-top: 35px;

      font-size: 13px;

      color:
        rgba(255, 255, 255, 0.45);

    }


    @media (max-width: 600px) {

      body {
        padding: 18px;
      }


      .card {

        padding: 45px 25px;

        border-radius: 20px;

      }


      h1 {

        font-size: 29px;

      }


      .message {

        font-size: 17px;

      }


      .message strong {

        font-size: 18px;

      }

    }

  </style>

</head>


<body>


  <main class="card">


    <div class="check">
      ✓
    </div>


    <h1>
      Ευχαριστούμε!
    </h1>


    <div class="message">

      Λάβαμε τα στοιχεία σας και θα επικοινωνήσουμε
      μαζί σας σύντομα.

      <strong>
        Ελπίζουμε σε μια όμορφη και δημιουργική συνεργασία.
      </strong>

    </div>


    <a
      class="home-button"
      href="https://power-internet-solutions.github.io/">

      Επιστροφή στην αρχική σελίδα

    </a>


    <div class="footer">

      Power Internet Solutions

    </div>


  </main>


</body>

</html>
