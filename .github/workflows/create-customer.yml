name: Διαχείριση ιστοσελίδων πελατών

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Επίλεξε αν θα δημιουργήσεις νέο πελάτη ή θα διορθώσεις υπάρχοντα"
        required: true
        type: choice
        options:
          - create
          - edit
        default: create
      slug:
        description: "URL πελάτη χωρίς /, π.χ. bakery-karditsa (στην επεξεργασία χρησιμοποίησε το υπάρχον URL)"
        required: true
        type: string
      company: {description: "Όνομα καταστήματος", required: false, type: string}
      owner: {description: "Ονοματεπώνυμο ιδιοκτήτη", required: false, type: string}
      firstname: {description: "Όνομα ιδιοκτήτη", required: false, type: string}
      lastname: {description: "Επώνυμο ιδιοκτήτη", required: false, type: string}
      owner_title: {description: "Ιδιότητα", required: false, type: string}
      landline: {description: "Σταθερό τηλέφωνο (με κωδικό χώρας)", required: false, type: string}
      phone: {description: "Κινητό τηλέφωνο (με κωδικό χώρας)", required: false, type: string}
      email: {description: "Email", required: false, type: string}
      website: {description: "Ιστοσελίδα με https://", required: false, type: string}
      address: {description: "Διεύθυνση", required: false, type: string}
      hours: {description: "Ωράριο", required: false, type: string}
      description: {description: "Περιγραφή επιχείρησης", required: false, type: string}
      tagline: {description: "Σύντομο μήνυμα στην κορυφή", required: false, type: string}
      owner_bio: {description: "Κείμενο για τον ιδιοκτήτη", required: false, type: string}
      background: {description: "Διαδρομή εικόνας φόντου, π.χ. /assets/images/shop.jpg", required: false, type: string}
      photo: {description: "Διαδρομή φωτογραφίας ιδιοκτήτη", required: false, type: string}
      gallery1: {description: "Gallery: φωτογραφία 1", required: false, type: string}
      gallery2: {description: "Gallery: φωτογραφία 2", required: false, type: string}
      gallery3: {description: "Gallery: φωτογραφία 3", required: false, type: string}
      gallery4: {description: "Gallery: φωτογραφία 4", required: false, type: string}
      gallery5: {description: "Gallery: φωτογραφία 5", required: false, type: string}
      gallery6: {description: "Gallery: φωτογραφία 6", required: false, type: string}
      instagram: {description: "URL Instagram", required: false, type: string}
      facebook: {description: "URL Facebook", required: false, type: string}
      tiktok: {description: "URL TikTok", required: false, type: string}
      linkedin: {description: "URL LinkedIn", required: false, type: string}

permissions:
  contents: write

jobs:
  manage-customer:
    runs-on: ubuntu-latest
    steps:
      - name: Λήψη repository
        uses: actions/checkout@v4

      - name: Δημιουργία ή ενημέρωση αρχείου πελάτη
        env:
          MODE: ${{ inputs.mode }}
          SLUG: ${{ inputs.slug }}
          COMPANY: ${{ inputs.company }}
          OWNER: ${{ inputs.owner }}
          FIRSTNAME: ${{ inputs.firstname }}
          LASTNAME: ${{ inputs.lastname }}
          OWNER_TITLE: ${{ inputs.owner_title }}
          LANDLINE: ${{ inputs.landline }}
          PHONE: ${{ inputs.phone }}
          EMAIL: ${{ inputs.email }}
          WEBSITE: ${{ inputs.website }}
          ADDRESS: ${{ inputs.address }}
          HOURS: ${{ inputs.hours }}
          DESCRIPTION: ${{ inputs.description }}
          TAGLINE: ${{ inputs.tagline }}
          OWNER_BIO: ${{ inputs.owner_bio }}
          BACKGROUND: ${{ inputs.background }}
          PHOTO: ${{ inputs.photo }}
          GALLERY1: ${{ inputs.gallery1 }}
          GALLERY2: ${{ inputs.gallery2 }}
          GALLERY3: ${{ inputs.gallery3 }}
          GALLERY4: ${{ inputs.gallery4 }}
          GALLERY5: ${{ inputs.gallery5 }}
          GALLERY6: ${{ inputs.gallery6 }}
          INSTAGRAM: ${{ inputs.instagram }}
          FACEBOOK: ${{ inputs.facebook }}
          TIKTOK: ${{ inputs.tiktok }}
          LINKEDIN: ${{ inputs.linkedin }}
        run: |
          python3 <<'PY'
          import json, os, re
          from pathlib import Path

          mode = os.environ.get("MODE", "create").strip()
          slug = os.environ.get("SLUG", "").strip().lower()
          if mode not in ("create", "edit"):
              raise SystemExit("Μη έγκυρη επιλογή. Επίλεξε create ή edit.")
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug):
              raise SystemExit("Το URL πρέπει να περιέχει μόνο λατινικά μικρά γράμματα, αριθμούς και παύλες, π.χ. bakery-karditsa.")

          target = Path("_customers") / (slug + ".md")
          if mode == "create" and target.exists():
              raise SystemExit("Υπάρχει ήδη πελάτης με αυτό το URL. Επίλεξε 'edit' για αλλαγές ή άλλο slug για νέο πελάτη.")
          if mode == "edit" and not target.exists():
              raise SystemExit(f"Δεν βρέθηκε το αρχείο {target}. Έλεγξε το slug και ότι ο πελάτης υπάρχει ήδη.")

          def val(key):
              return os.environ.get(key, "").strip()
          def quote(value):
              return json.dumps(value, ensure_ascii=False)

          # Οι κενές τιμές στην επεξεργασία διατηρούν τα ήδη αποθηκευμένα δεδομένα.
          # Για να διαγραφεί μια τιμή, γράψε ακριβώς __CLEAR__ στο αντίστοιχο πεδίο.
          fields = [
              ("firstname", "FIRSTNAME"), ("lastname", "LASTNAME"),
              ("name", "OWNER"), ("owner", "OWNER"),
              ("owner_title", "OWNER_TITLE"), ("company", "COMPANY"),
              ("tagline", "TAGLINE"), ("description", "DESCRIPTION"),
              ("owner_bio", "OWNER_BIO"), ("landline", "LANDLINE"), ("phone", "PHONE"),
              ("email", "EMAIL"), ("website", "WEBSITE"),
              ("address", "ADDRESS"), ("hours", "HOURS"),
              ("photo", "PHOTO"), ("background", "BACKGROUND"),
              ("instagram", "INSTAGRAM"), ("facebook", "FACEBOOK"),
              ("tiktok", "TIKTOK"), ("linkedin", "LINKEDIN"),
          ]

          if mode == "create":
              required = {"COMPANY": "Όνομα καταστήματος", "OWNER": "Ονοματεπώνυμο ιδιοκτήτη",
                          "FIRSTNAME": "Όνομα ιδιοκτήτη", "LASTNAME": "Επώνυμο ιδιοκτήτη",
                          "DESCRIPTION": "Περιγραφή επιχείρησης"}
              missing = [label for key, label in required.items() if not val(key)]
              if missing:
                  raise SystemExit("Για νέο πελάτη συμπλήρωσε τα υποχρεωτικά πεδία: " + ", ".join(missing))
              lines = ["layout: customer"]
          else:
              original = target.read_text(encoding="utf-8").splitlines()
              if not original or original[0].strip() != "---":
                  raise SystemExit("Το αρχείο πελάτη δεν έχει αναγνωρίσιμη ενότητα front matter.")
              try:
                  end = next(i for i in range(1, len(original)) if original[i].strip() == "---")
              except StopIteration:
                  raise SystemExit("Δεν βρέθηκε η γραμμή --- που κλείνει τα πεδία του πελάτη.")
              lines = original[1:end]

          # Ενημέρωση απλών πεδίων YAML, χωρίς να πειράζονται τα υπόλοιπα στοιχεία.
          updates = {}
          clears = set()
          for key, envkey in fields:
              value = val(envkey)
              if value == "__CLEAR__":
                  clears.add(key)
              elif value:
                  updates[key] = value
              elif mode == "create":
                  continue

          existing_keys = set()
          new_lines = []
          for line in lines:
              match = re.match(r"^([A-Za-z0-9_-]+):(?:\s.*)?$", line)
              if match:
                  key = match.group(1)
                  if key == "gallery":
                      # Η gallery επεξεργάζεται ως ξεχωριστό block παρακάτω.
                      new_lines.append(line)
                      continue
                  if key in clears:
                      existing_keys.add(key)
                      continue
                  if key in updates:
                      new_lines.append(f"{key}: {quote(updates[key])}")
                      existing_keys.add(key)
                      continue
                  existing_keys.add(key)
              new_lines.append(line)
          lines = new_lines

          # Πρόσθεσε νέα πεδία πριν από gallery/permalink, για να μείνει καθαρό το front matter.
          missing_lines = []
          for key, value in updates.items():
              if key not in existing_keys:
                  missing_lines.append(f"{key}: {quote(value)}")
          if missing_lines:
              insert_at = len(lines)
              for i, line in enumerate(lines):
                  if re.match(r"^(gallery|permalink):", line):
                      insert_at = i
                      break
              lines[insert_at:insert_at] = missing_lines

          # Gallery: έως 6 φωτογραφίες.
          # Στην επεξεργασία, αν όλα τα πεδία είναι κενά,
          # διατηρείται η υπάρχουσα συλλογή.
          gallery_values = [val(f"GALLERY{i}") for i in range(1, 7)]

          gallery_requested = (
              mode == "create"
              or any(value for value in gallery_values)
          )

          if gallery_requested:
              start = next(
                  (
                      i for i, line in enumerate(lines)
                      if re.match(r"^gallery:\s*$", line)
                  ),
                  None
              )

              if start is not None:
                  end = start + 1
                  while end < len(lines) and (
                      lines[end].startswith(" ")
                      or lines[end].startswith("\t")
                      or not lines[end].strip()
                  ):
                      end += 1
                  del lines[start:end]

              images = [
                  value for value in gallery_values
                  if value and value != "__CLEAR__"
              ]

              if images:
                  block = ["gallery:"]
                  for i, src in enumerate(images, 1):
                      block.extend([
                          f"  - src: {quote(src)}",
                          f"    alt: {quote(slug + ' - φωτογραφία ' + str(i))}"
                      ])

                  insert_at = next(
                      (
                          i for i, line in enumerate(lines)
                          if line.startswith("permalink:")
                      ),
                      len(lines)
                  )
                  lines[insert_at:insert_at] = block

          # Διατήρησε permalink του πελάτη και το υπόλοιπο περιεχόμενο μετά το front matter.
          if mode == "create":
              if not any(line.startswith("permalink:") for line in lines):
                  lines.append(f"permalink: /{slug}/")
              output = ["---"] + lines + ["---", ""]
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text("\n".join(output), encoding="utf-8")
          else:
              original = target.read_text(encoding="utf-8").splitlines()
              end = next(i for i in range(1, len(original)) if original[i].strip() == "---")
              body = original[end + 1:]
              output = ["---"] + lines + ["---"] + body
              target.write_text("\n".join(output).rstrip("\n") + "\n", encoding="utf-8")

          print(("Δημιουργήθηκε" if mode == "create" else "Ενημερώθηκε") + f" το {target}")
          PY

      - name: Commit και δημοσίευση
        env:
          MODE: ${{ inputs.mode }}
          SLUG: ${{ inputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "_customers/${SLUG}.md"
          if git diff --cached --quiet; then
            echo "Δεν υπάρχουν αλλαγές για αποθήκευση."
            exit 0
          fi
          if [ "$MODE" = "create" ]; then
            git commit -m "Add customer page: $SLUG"
          else
            git commit -m "Update customer page: $SLUG"
          fi
          git push
